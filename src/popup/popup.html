<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TabVault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>TabVault</h1>
      <span id="status" class="status">Idle</span>
    </header>

    <section class="card">
      <div class="label">Current source</div>
      <div id="sourceType" class="source-type">Detecting…</div>
      <div id="pageTitle" class="page-title"></div>
      <div id="pageUrl" class="page-url"></div>
    </section>

    <section class="card">
      <div class="row">
        <span>Tab video</span>
        <strong id="videoStatus">Ready</strong>
      </div>
      <div class="row">
        <span>Tab audio</span>
        <strong id="audioStatus">Ready</strong>
      </div>
      <label class="row toggle-row" for="localPlayback">
        <span>Play through speakers</span>
        <input id="localPlayback" type="checkbox">
      </label>
      <div class="row">
        <span>Upload</span>
        <strong>Never</strong>
      </div>
    </section>

    <section id="captureDetails" class="card hidden">
      <div class="label">Capturing</div>
      <div id="captureTitle" class="page-title"></div>
      <div id="captureHint" class="footnote"></div>
    </section>

    <button id="recordButton" type="button">Start tab capture</button>

    <div id="errorMessage" class="error hidden" role="alert"></div>

    <p class="footnote">
      TabVault captures only the tab selected when capture starts. You can switch
      to other tabs, windows, or applications afterwards.
    </p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
